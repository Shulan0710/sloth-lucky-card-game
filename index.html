<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运翻牌闯关 | 树懒的小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 28px;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 16px;
            color: #34495e;
            font-weight: 500;
        }

        .tip-text {
            color: #666;
            margin-bottom: 10px;
            height: 24px;
        }

        .btn-rule {
            padding: 6px 14px;
            border: none;
            background: #5b86e5;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom:24px;
        }

        /* 卡牌容器，自动自适应网格 */
        .card-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 14px;
            margin: 30px 0;
            perspective: 1000px;
        }

        /* 卡牌核心3D样式 */
        .card-item {
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            user-select: none;
        }

        .card-item.flip {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 8px 20px #00000020;
            backface-visibility: hidden;
        }

        .card-front {
            background: linear-gradient(145deg, #5b86e5, #36d1dc);
            color: white;
        }

        .card-back {
            background: #fff;
            color: #2c3e50;
            transform: rotateY(180deg);
        }

        .card-item:hover:not(.flip) {
            transform: scale(1.03);
        }

        .result {
            font-size: 20px;
            margin:20px 0;
            min-height: 60px;
            font-weight: bold;
        }

        /* 失败抖动 */
        @keyframes shake {
            0%,100% {transform: translateX(0)}
            20% {transform: translateX(-8px)}
            40% {transform: translateX(8px)}
            60% {transform: translateX(-8px)}
            80% {transform: translateX(8px)}
        }
        .shake {
            animation: shake 0.4s;
        }

        /* 成功闪烁 */
        @keyframes glow {
            0%,100% {opacity:1}
            50% {opacity:0.5}
        }
        .glow {
            animation: glow 0.5s 2;
        }

        /* 颜文字弹窗 */
        .emoticon-popup {
            position: fixed;
            font-size: 32px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 999;
        }
        @keyframes floatUp {
            0% {opacity:1; transform: translateY(0);}
            100% {opacity:0; transform: translateY(-120px);}
        }

        /* 规则弹窗 */
        .modal {
            position: fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.4);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1000;
        }
        .modal-content{
            background:#fff;
            padding:24px;
            border-radius:16px;
            max-width:360px;
        }
        .modal-content h3{margin-bottom:12px;}
        .modal-content p{text-align:left;line-height:1.6;color:#333;}
        .close-modal{margin-top:16px;padding:6px 14px;border:none;background:#5b86e5;color:white;border-radius:8px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h2>幸运翻牌闯关</h2>
        <div class="info-bar">
            <div>当前关卡：<span id="level">1</span></div>
            <div>最高纪录：<span id="highScore">1</span></div>
            <div>卡牌数量：<span id="cardCount">2</span></div>
        </div>
        <button class="btn-rule" onclick="openRule()">📖游戏规则</button>
        <div class="tip-text">选择一张卡牌翻开，小心炸弹💣</div>
        <div class="card-wrap" id="cardWrap">
            <!-- JS动态生成卡牌 -->
        </div>
        <div class="result" id="msg"></div>
    </div>

    <!-- 游戏规则弹窗 -->
    <div class="modal" id="ruleModal">
        <div class="modal-content">
            <h3>📖 游戏规则</h3>
            <p>1. 第1关2张牌，每通关一关卡牌+2，最多24张<br>
2. ⭐🍀💎=闯关成功；💣炸弹=失败，本关重开<br>
3. 卡牌越多炸弹数量越多，类似扫雷<br>
4. 每5关随机触发彩蛋，获得特殊增益。</p >
            <button class="close-modal" onclick="closeRule()">知道啦</button>
        </div>
    </div>

    <script>
        let level = 1;
        let eggActive = false;
        let isClicking = false;
        let cardList = []; //存储当前关卡卡牌内容

        // ===== 扩充颜文字库 =====
        const successEmoji = [
            "٩(๑>◡<๑)۶", "(≧∇≦)ﾉ", "ヽ(✿ﾟ▽ﾟ)ノ", "(๑•̀ㅂ•́)و✧", "✧(≖ ◡ ≖✿)",
            "ヽ(°▽°)ノ", "(๑˃̵ᴗ˂̵)و", "☜(ﾟヮﾟ☜)", "(*´▽`*)", "ʕ•̀ω•́ʔ✧",
            "ヾ(≧▽≦*)o", "٩(˃̶͈̀௰˂̶͈́)و", "✧⁺⸜(●˙▾˙●)⸝⁺✧", "ヽ(•̀ω•́ )ゝ", "⋆⸜ᵀᴴᴬᴺᴷ ᵞᴼᵁ⸝⋆"
        ]
        const failEmoji = [
            "ಥ_ಥ", "｡･ﾟﾟ･(>д<)･ﾟﾟ･｡", "(；´д｀)ゞ", "┐(´-｀)┌", "ヽ(´o｀；",
            "(╯﹏╰）", "o(╥﹏╥)o", "┗|｀O´|┛", "・゜・(ノД`)・゜・", "ヽ(｡･ω･｡)ﾉ",
            "╮(╯▽╰)╭", "｡ﾟ(ﾟ´Д｀ﾟ)ﾟ｡", "(-ω-；)", "〒▽〒", "┌(。Д。)┐"
        ]

        // ===== 树懒语录（带颜文字）=====
        const slothWords = [
            "树懒祝你天天开心 ʕ•ᴥ•ʔ",
            "树懒提醒你该喝水啦 (๑•̀ㅂ•́)و✧",
            "树懒让你起来走一走 ʕ˙Ⱉ˙ʔ",
            "树懒说慢慢来，不用急~ (´･ω･`)",
            "树懒给你递小零食 ʕ♡˙ᴥ˙♡ʔ",
            "树懒祝你好运连连 ✧(≖ ◡ ≖✿)",
            "树懒说累了就歇一会儿 (๑´ㅂ`๑)",
            "树懒悄悄为你加油 ʕ•̀ω•́ʔ",
            "树懒提醒你深呼吸一下 ヽ(•̀ω•́ )ゝ",
            "树懒觉得你超棒！ヾ(≧▽≦*)o"
        ]

        // 幸运图标
        const luckyIcons = ["⭐","🍀","💎"];

        // 读取本地存档最高分
        let highScore = localStorage.getItem("luckyCardHigh") || 1;
        document.getElementById("highScore").innerText = highScore;

        // 初始化当前关卡卡牌
        function initLevel(){
            //卡牌数量：第1关2张，每关+2，上限24
            const maxCard = 24;
            const cardCount = Math.min(2 + (level-1)*2, maxCard);
            document.getElementById("cardCount").innerText = cardCount;
            document.getElementById("level").innerText = level;

            //炸弹比例：卡牌总数 * 0.25，至少1个炸弹
            let bombNum = Math.max(1, Math.floor(cardCount * 0.25));
            let luckyNum = cardCount - bombNum;

            cardList = [];
            //填充幸运牌
            for(let i=0;i<luckyNum;i++){
                const icon = luckyIcons[Math.floor(Math.random()*luckyIcons.length)];
                cardList.push(icon);
            }
            //填充炸弹
            for(let i=0;i<bombNum;i++){
                cardList.push("💣");
            }
            //洗牌算法打乱数组
            shuffleArray(cardList);
            renderCards();
        }

        //洗牌函数
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        //渲染卡牌到页面
        function renderCards(){
            const wrap = document.getElementById("cardWrap");
            wrap.innerHTML = "";
            cardList.forEach((icon, idx)=>{
                const div = document.createElement("div");
                div.className = "card-item";
                div.onclick = function(e){pick(idx, this, e)};
                div.innerHTML = `
                    <div class="card-front">?</div>
                    <div class="card-back">${icon}</div>
                `;
                wrap.appendChild(div);
            })
        }

        // 彩蛋系统
        function checkEgg(){
            if(level %5 ===0 && Math.random()>0.5){
                eggActive = true;
                const eggs = [
                    "✨彩蛋触发：幸运加持，本关炸弹数量减少1个！",
                    "✨彩蛋触发：双牌机会，选到幸运牌直接过关！",
                    "✨彩蛋触发：幸运buff，炸弹概率降低！"
                ]
                const randomEgg = eggs[Math.floor(Math.random()*eggs.length)]
                return randomEgg;
            }
            eggActive=false;
            return "";
        }

        // 弹出普通颜文字
        function showEmoticon(isSuccess, event) {
            const popup = document.createElement('div');
            popup.className = "emoticon-popup";
            let list = isSuccess ? successEmoji : failEmoji;
            popup.innerText = list[Math.floor(Math.random() * list.length)];
            popup.style.left = event.clientX + "px";
            popup.style.top = event.clientY + "px";
            document.body.appendChild(popup);
            setTimeout(()=>popup.remove(),1200);
        }

        // 弹出树懒语录
        function showSlothWord(event){
            const popup = document.createElement('div');
            popup.className = "emoticon-popup";
            let text = slothWords[Math.floor(Math.random()*slothWords.length)];
            popup.innerText = text;
            popup.style.left = event.clientX + "px";
            popup.style.top = (event.clientY - 50) + "px";
            document.body.appendChild(popup);
            setTimeout(()=>popup.remove(),1200);
        }

        // 打开关闭规则弹窗
        function openRule(){document.getElementById("ruleModal").style.display="flex";}
        function closeRule(){document.getElementById("ruleModal").style.display="none";}

        function pick(index, cardDom, event){
            if(isClicking) return;
            isClicking = true;
            cardDom.classList.add("flip");
            const msgDom = document.getElementById('msg');
            const eggTip = checkEgg();
            let isBomb = cardList[index] === "💣";

            //彩蛋：幸运加持，减少炸弹
            if(eggActive && isBomb){
                isBomb = false;
            }

            setTimeout(()=>{
                //20%概率触发树懒语录
                if(Math.random() < 0.20){
                    showSlothWord(event);
                }else{
                    showEmoticon(!isBomb, event);
                }

                if(isBomb){
                    msgDom.innerHTML = eggTip + "<br>💣炸弹！闯关失败，本关重新开始";
                    document.querySelector(".container").classList.add("shake");
                    setTimeout(()=>document.querySelector(".container").classList.remove("shake"),400);
                    //失败，重新生成当前关卡卡牌
                    setTimeout(()=>{
                        initLevel();
                        isClicking = false;
                    },1400)
                }else{
                    msgDom.innerHTML = eggTip + "<br>🎉闯关成功！进入下一关";
                    document.querySelector(".container").classList.add("glow");
                    setTimeout(()=>document.querySelector(".container").classList.remove("glow"),1000);
                    //通关，升级
                    level++;
                    if(level > highScore){
                        highScore = level;
                        localStorage.setItem("luckyCardHigh", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                    //加载下一关卡牌
                    setTimeout(()=>{
                        initLevel();
                        isClicking = false;
                    },1400)
                }
            },650);
        }

        //页面加载初始化第一关
        window.onload = function(){
            initLevel();
        }
    </script>
</body>
</html>
