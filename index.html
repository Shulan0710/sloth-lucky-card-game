<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运翻牌闯关 | 树懒的小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 28px;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 16px;
            color: #34495e;
            font-weight: 500;
        }

        .tip-text {
            color: #666;
            margin-bottom: 10px;
            height: 24px;
        }

        .btn-rule {
            padding: 6px 14px;
            border: none;
            background: #5b86e5;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom:24px;
        }

        /* 卡牌容器 */
        .card-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 40px 0;
            perspective: 1000px;
        }

        /* 卡牌核心3D样式 */
        .card-item {
            height: 140px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            user-select: none;
        }

        .card-item.flip {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 8px 20px #00000020;
            backface-visibility: hidden;
        }

        .card-front {
            background: linear-gradient(145deg, #5b86e5, #36d1dc);
            color: white;
        }

        .card-back {
            background: #fff;
            color: #2c3e50;
            transform: rotateY(180deg);
        }

        .card-item:hover:not(.flip) {
            transform: scale(1.03);
        }

        .result {
            font-size: 20px;
            margin:20px 0;
            min-height: 60px;
            font-weight: bold;
        }

        /* 失败抖动 */
        @keyframes shake {
            0%,100% {transform: translateX(0)}
            20% {transform: translateX(-8px)}
            40% {transform: translateX(8px)}
            60% {transform: translateX(-8px)}
            80% {transform: translateX(8px)}
        }
        .shake {
            animation: shake 0.4s;
        }

        /* 成功闪烁 */
        @keyframes glow {
            0%,100% {opacity:1}
            50% {opacity:0.5}
        }
        .glow {
            animation: glow 0.5s 2;
        }

        /* 颜文字弹窗 */
        .emoticon-popup {
            position: fixed;
            font-size: 32px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 999;
        }
        @keyframes floatUp {
            0% {opacity:1; transform: translateY(0);}
            100% {opacity:0; transform: translateY(-120px);}
        }

        /* 规则弹窗 */
        .modal {
            position: fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.4);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1000;
        }
        .modal-content{
            background:#fff;
            padding:24px;
            border-radius:16px;
            max-width:360px;
        }
        .modal-content h3{margin-bottom:12px;}
        .modal-content p{text-align:left;line-height:1.6;color:#333;}
        .close-modal{margin-top:16px;padding:6px 14px;border:none;background:#5b86e5;color:white;border-radius:8px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h2>幸运翻牌闯关</h2>
        <div class="info-bar">
            <div>当前关卡：<span id="level">1</span></div>
            <div>最高纪录：<span id="highScore">1</span></div>
        </div>
        <button class="btn-rule" onclick="openRule()">📖游戏规则</button>
        <div class="tip-text">选择一张卡牌，小心炸弹💣</div>
        <div class="card-wrap">
            <div class="card-item" onclick="pick('A', this, event)">
                <div class="card-front">A</div>
                <div class="card-back">⭐ A</div>
            </div>
            <div class="card-item" onclick="pick('B', this, event)">
                <div class="card-front">B</div>
                <div class="card-back">🍀 B</div>
            </div>
            <div class="card-item" onclick="pick('C', this, event)">
                <div class="card-front">C</div>
                <div class="card-back">💎 C</div>
            </div>
            <div class="card-item" onclick="pick('D', this, event)">
                <div class="card-front">D</div>
                <div class="card-back">💣 D</div>
            </div>
        </div>
        <div class="result" id="msg"></div>
    </div>

    <!-- 游戏规则弹窗 -->
    <div class="modal" id="ruleModal">
        <div class="modal-content">
            <h3>📖 游戏规则</h3>
            <p>1. 四张卡牌，选一张翻开。<br>
2. ⭐🍀💎=闯关成功，升级；💣炸弹=失败，本关重开。<br>
3. 每5关随机触发彩蛋，获得特殊增益。<br>
4. 关卡越高，炸弹概率越高，挑战你的运气！</p >
            <button class="close-modal" onclick="closeRule()">知道啦</button>
        </div>
    </div>

    <script>
        let level = 1;
        let bombChance = 0.25;
        let eggActive = false;
        let isClicking = false;

        // ===== 扩充颜文字库 =====
        const successEmoji = [
            "٩(๑>◡<๑)۶", "(≧∇≦)ﾉ", "ヽ(✿ﾟ▽ﾟ)ノ", "(๑•̀ㅂ•́)و✧", "✧(≖ ◡ ≖✿)",
            "ヽ(°▽°)ノ", "(๑˃̵ᴗ˂̵)و", "☜(ﾟヮﾟ☜)", "(*´▽`*)", "ʕ•̀ω•́ʔ✧",
            "ヾ(≧▽≦*)o", "٩(˃̶͈̀௰˂̶͈́)و", "✧⁺⸜(●˙▾˙●)⸝⁺✧", "ヽ(•̀ω•́ )ゝ", "⋆⸜ᵀᴴᴬᴺᴷ ᵞᴼᵁ⸝⋆"
        ]
        const failEmoji = [
            "ಥ_ಥ", "｡･ﾟﾟ･(>д<)･ﾟﾟ･｡", "(；´д｀)ゞ", "┐(´-｀)┌", "ヽ(´o｀；",
            "(╯﹏╰）", "o(╥﹏╥)o", "┗|｀O´|┛", "・゜・(ノД`)・゜・", "ヽ(｡･ω･｡)ﾉ",
            "╮(╯▽╰)╭", "｡ﾟ(ﾟ´Д｀ﾟ)ﾟ｡", "(-ω-；)", "〒▽〒", "┌(。Д。)┐"
        ]

        // ===== 树懒语录（带颜文字）=====
        const slothWords = [
            "树懒祝你天天开心 ʕ•ᴥ•ʔ",
            "树懒提醒你该喝水啦 (๑•̀ㅂ•́)و✧",
            "树懒让你起来走一走 ʕ˙Ⱉ˙ʔ",
            "树懒说慢慢来，不用急~ (´･ω･`)",
            "树懒给你递小零食 ʕ♡˙ᴥ˙♡ʔ",
            "树懒祝你好运连连 ✧(≖ ◡ ≖✿)",
            "树懒说累了就歇一会儿 (๑´ㅂ`๑)",
            "树懒悄悄为你加油 ʕ•̀ω•́ʔ",
            "树懒提醒你深呼吸一下 ヽ(•̀ω•́ )ゝ",
            "树懒觉得你超棒！ヾ(≧▽≦*)o"
        ]

        // 读取本地存档最高分
        let highScore = localStorage.getItem("luckyCardHigh") || 1;
        document.getElementById("highScore").innerText = highScore;

        // 彩蛋系统
        function checkEgg(){
            if(level %5 ===0 && Math.random()>0.5){
                eggActive = true;
                const eggs = [
                    "✨彩蛋触发：幸运加持，本局避开炸弹！",
                    "✨彩蛋触发：双牌机会，选对就过关！",
                    "✨彩蛋触发：炸弹概率减半！"
                ]
                const randomEgg = eggs[Math.floor(Math.random()*eggs.length)]
                return randomEgg;
            }
            eggActive=false;
            return "";
        }

        // 弹出普通颜文字
        function showEmoticon(isSuccess, event) {
            const popup = document.createElement('div');
            popup.className = "emoticon-popup";
            let list = isSuccess ? successEmoji : failEmoji;
            popup.innerText = list[Math.floor(Math.random() * list.length)];
            popup.style.left = event.clientX + "px";
            popup.style.top = event.clientY + "px";
            document.body.appendChild(popup);
            setTimeout(()=>popup.remove(),1200);
        }

        // 弹出树懒语录
        function showSlothWord(event){
            const popup = document.createElement('div');
            popup.className = "emoticon-popup";
            let text = slothWords[Math.floor(Math.random()*slothWords.length)];
            popup.innerText = text;
            popup.style.left = event.clientX + "px";
            popup.style.top = (event.clientY - 50) + "px";
            document.body.appendChild(popup);
            setTimeout(()=>popup.remove(),1200);
        }

        // 打开关闭规则弹窗
        function openRule(){document.getElementById("ruleModal").style.display="flex";}
        function closeRule(){document.getElementById("ruleModal").style.display="none";}

        function pick(sel, cardDom, event){
            if(isClicking) return;
            isClicking = true;
            cardDom.classList.add("flip");

            const msgDom = document.getElementById('msg');
            const eggTip = checkEgg();
            let isBomb = (Math.random() < bombChance);
            if(eggActive) isBomb = false;
            if(sel === 'D' && !eggActive) isBomb=true;

            setTimeout(()=>{
                // 20%概率触发树懒语录
                if(Math.random() < 0.20){
                    showSlothWord(event);
                }else{
                    showEmoticon(!isBomb, event);
                }

                if(isBomb){
                    msgDom.innerHTML = eggTip + "<br>💣炸弹！闯关失败，本关重来";
                    document.querySelector(".container").classList.add("shake");
                    setTimeout(()=>document.querySelector(".container").classList.remove("shake"),400);
                }else{
                    level++;
                    bombChance = Math.min(0.45, 0.25 + level*0.008);
                    document.getElementById('level').innerText = level;
                    if(level > highScore){
                        highScore = level;
                        localStorage.setItem("luckyCardHigh", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                    msgDom.innerHTML = eggTip + "<br>🎉闯关成功！进入下一关";
                    document.querySelector(".container").classList.add("glow");
                    setTimeout(()=>document.querySelector(".container").classList.remove("glow"),1000);
                }
                // 重置卡牌，允许下一轮点击
                setTimeout(()=>{
                    document.querySelectorAll(".card-item").forEach(c=>c.classList.remove("flip"))
                    isClicking = false;
                },1400)
            },650);
        }
    </script>
</body>
</html>
